# The wl module conflicts with other broadcom modules. Disable all of
# them here, then load the correct one later via a udev rule.
blacklist b43
blacklist b43legacy
blacklist bcma
blacklist brcmfmac
blacklist brcmsmac
blacklist ssb
blacklist wl
